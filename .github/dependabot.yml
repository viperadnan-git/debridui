version: 2

updates:
    - package-ecosystem: bun
      directory: /
      schedule:
          interval: weekly
      groups:
          minor-patch:
              update-types: [minor, patch]

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: monthly
      groups:
          actions:
              patterns: ["*"]

    - package-ecosystem: docker
      directory: /
      schedule:
          interval: monthly
