name: CI

on:
    pull_request:
    workflow_call:

jobs:
    verify:
        name: Verify and Build
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Verify
              run: bun run verify

            - name: Build
              run: bun run build
